name: Validate ViralVoice LipSync

on:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'server-v3.js'
      - 'package.json'
      - 'speaker-sync.js'
      - 'lib/**'
      - 'lipsync-service/**'
      - '.github/workflows/validate-lipsync.yml'
  pull_request:
    paths:
      - 'server-v3.js'
      - 'package.json'
      - 'speaker-sync.js'
      - 'lib/**'
      - 'lipsync-service/**'
      - '.github/workflows/validate-lipsync.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Check Node files
        run: npm run check

      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Validate Python and YAML
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.2
          python -m py_compile lipsync-service/app.py lipsync-service/engine.py
          python - <<'PY'
          import yaml
          from pathlib import Path
          yaml.safe_load(Path('lipsync-service/docker-compose.gpu.yml').read_text())
          print('docker-compose.gpu.yml valide')
          PY

      - name: Check shell script
        run: bash -n lipsync-service/start.sh
