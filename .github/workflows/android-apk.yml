name: Build ViralVoice 4 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'backend/**'
      - 'lib/**'
      - 'scripts/**'
      - 'server-v3.js'
      - 'package.json'
      - 'script.js'
      - 'speaker-sync-v36.js'
      - 'pro-v36.js'
      - 'audio-presets.js'
      - 'runtime-v402.js'
      - 'admin-budget-counter.js'
      - 'migration-backup.js'
      - 'web-updater.js'
      - 'recovery-client.js'
      - 'update.json'
      - 'index.html'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'backend/**'
      - 'lib/**'
      - 'scripts/**'
      - 'server-v3.js'
      - 'package.json'
      - 'script.js'
      - 'speaker-sync-v36.js'
      - 'pro-v36.js'
      - 'audio-presets.js'
      - 'runtime-v402.js'
      - 'admin-budget-counter.js'
      - 'migration-backup.js'
      - 'web-updater.js'
      - 'recovery-client.js'
      - 'update.json'
      - 'index.html'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write
  id-token: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate ViralVoice backend, audio and recovery
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npm run check
          node --check runtime-v402.js
          node --check admin-budget-counter.js
          node --check migration-backup.js
          node --check web-updater.js
          node --check recovery-client.js
          node -e "const u=require('./update.json'); if(u.versionCode!==23 || u.versionName!=='4.0.10') process.exit(1)"
          cd backend
          npm install --no-audit --no-fund
          npm run check

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Fetch protected Android signing key
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          OIDC_RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=viralvoice-android-signing")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_RESPONSE" | jq -r '.value')"
          test -n "$OIDC_TOKEN"
          test "$OIDC_TOKEN" != "null"

          SIGNING_JSON="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            https://viralvoice.onrender.com/api/ci/android-signing)"

          STORE_PASSWORD="$(printf '%s' "$SIGNING_JSON" | jq -r '.storePassword')"
          KEY_ALIAS="$(printf '%s' "$SIGNING_JSON" | jq -r '.keyAlias')"
          KEY_PASSWORD="$(printf '%s' "$SIGNING_JSON" | jq -r '.keyPassword')"
          KEYSTORE_B64="$(printf '%s' "$SIGNING_JSON" | jq -r '.keystoreBase64')"

          test -n "$STORE_PASSWORD" && test "$STORE_PASSWORD" != "null"
          test -n "$KEY_ALIAS" && test "$KEY_ALIAS" != "null"
          test -n "$KEY_PASSWORD" && test "$KEY_PASSWORD" != "null"
          test -n "$KEYSTORE_B64" && test "$KEYSTORE_B64" != "null"

          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/viralvoice-release.p12"
          chmod 600 "$RUNNER_TEMP/viralvoice-release.p12"

          {
            echo "PLAY_UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/viralvoice-release.p12"
            echo "PLAY_STORE_PASSWORD=$STORE_PASSWORD"
            echo "PLAY_KEY_ALIAS=$KEY_ALIAS"
            echo "PLAY_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          gradle -p android wrapper --gradle-version 8.7
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Verify stable update signature
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          keytool -printcert -jarfile "$APK" > /tmp/viralvoice-cert.txt
          grep -F "SHA256: AD:54:87:3D:60:DF:3C:0E:78:15:1E:6E:F9:1C:CE:FA:B4:7D:D3:01:61:24:10:23:7C:57:95:4B:4D:85:9C:E6" /tmp/viralvoice-cert.txt

      - name: Build PR debug APK
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          gradle -p android wrapper --gradle-version 8.7
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare single APK
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk ViralVoice-4.0.10.apk
          {
            echo "status=success"
            echo "version=4.0.10"
            echo "signed=stable-release"
            echo "signer_sha256=AD:54:87:3D:60:DF:3C:0E:78:15:1E:6E:F9:1C:CE:FA:B4:7D:D3:01:61:24:10:23:7C:57:95:4B:4D:85:9C:E6"
            echo "commit=${GITHUB_SHA}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > build-status.txt

      - name: Upload APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ViralVoice-4.0.10-APK
          path: ViralVoice-4.0.10.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p /tmp/viralvoice-apk
          cp ViralVoice-4.0.10.apk build-status.txt /tmp/viralvoice-apk/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-builds
          git rm -rf .
          git clean -fdx
          cp /tmp/viralvoice-apk/* .
          git add .
          git commit -m "Publish stable-signed ViralVoice 4.0.10 APK ${GITHUB_SHA}"
          git push --force origin HEAD:apk-builds

      - name: Create or update GitHub Release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v4.0.10"
          TITLE="ViralVoice v4.0.10"
          NOTES="ViralVoice 4.0.10 : ajout d'une vraie barre de progression native pour les mises à jour. Après validation, le téléchargement reste visible de 0 à 100 %, puis ViralVoice indique que l'APK est prêt et ouvre l'installation Android. Même signature stable : les données et réglages sont conservés."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ViralVoice-4.0.10.apk --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --latest
          else
            gh release create "$TAG" ViralVoice-4.0.10.apk \
              --target main \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest
          fi
