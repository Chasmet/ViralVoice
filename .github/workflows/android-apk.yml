name: Build ViralVoice 4 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'backend/**'
      - 'lib/**'
      - 'scripts/**'
      - 'server-v3.js'
      - 'package.json'
      - 'app-v410.js'
      - 'stable-v410.css'
      - 'index.html'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'backend/**'
      - 'lib/**'
      - 'scripts/**'
      - 'server-v3.js'
      - 'package.json'
      - 'app-v410.js'
      - 'stable-v410.css'
      - 'index.html'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write
  id-token: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Android version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n "s/^[[:space:]]*versionName[[:space:]]*'\([^']*\)'.*/\1/p" android/app/build.gradle | head -n1)"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p' android/app/build.gradle | head -n1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "APK_NAME=ViralVoice-$VERSION_NAME.apk" >> "$GITHUB_ENV"

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate backend and stable 4.1 UI
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
          node --check app-v410.js
          node scripts/ui-stability-smoke.js
          cd backend
          npm install --no-audit --no-fund
          npm run check

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Fetch protected Android signing key
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          OIDC_RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=viralvoice-android-signing")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_RESPONSE" | jq -r '.value')"
          test -n "$OIDC_TOKEN"
          test "$OIDC_TOKEN" != "null"

          SIGNING_JSON="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            https://viralvoice.onrender.com/api/ci/android-signing)"

          STORE_PASSWORD="$(printf '%s' "$SIGNING_JSON" | jq -r '.storePassword')"
          KEY_ALIAS="$(printf '%s' "$SIGNING_JSON" | jq -r '.keyAlias')"
          KEY_PASSWORD="$(printf '%s' "$SIGNING_JSON" | jq -r '.keyPassword')"
          KEYSTORE_B64="$(printf '%s' "$SIGNING_JSON" | jq -r '.keystoreBase64')"

          test -n "$STORE_PASSWORD" && test "$STORE_PASSWORD" != "null"
          test -n "$KEY_ALIAS" && test "$KEY_ALIAS" != "null"
          test -n "$KEY_PASSWORD" && test "$KEY_PASSWORD" != "null"
          test -n "$KEYSTORE_B64" && test "$KEYSTORE_B64" != "null"

          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/viralvoice-release.p12"
          chmod 600 "$RUNNER_TEMP/viralvoice-release.p12"

          {
            echo "PLAY_UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/viralvoice-release.p12"
            echo "PLAY_STORE_PASSWORD=$STORE_PASSWORD"
            echo "PLAY_KEY_ALIAS=$KEY_ALIAS"
            echo "PLAY_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          gradle -p android wrapper --gradle-version 8.7
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Verify stable update signature
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          keytool -printcert -jarfile "$APK" > /tmp/viralvoice-cert.txt
          grep -F "SHA256: AD:54:87:3D:60:DF:3C:0E:78:15:1E:6E:F9:1C:CE:FA:B4:7D:D3:01:61:24:10:23:7C:57:95:4B:4D:85:9C:E6" /tmp/viralvoice-cert.txt

      - name: Build PR debug APK
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          gradle -p android wrapper --gradle-version 8.7
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare single APK
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test -f android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          {
            echo "status=success"
            echo "version=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "signed=stable-release"
            echo "signer_sha256=AD:54:87:3D:60:DF:3C:0E:78:15:1E:6E:F9:1C:CE:FA:B4:7D:D3:01:61:24:10:23:7C:57:95:4B:4D:85:9C:E6"
            echo "commit=${GITHUB_SHA}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > build-status.txt

      - name: Upload APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ViralVoice-${{ env.VERSION_NAME }}-APK
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK and manifest atomically
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/viralvoice-apk
          cp "$APK_NAME" build-status.txt /tmp/viralvoice-apk/
          cat > /tmp/viralvoice-apk/update.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "title": "ViralVoice ${VERSION_NAME} Stable est disponible",
            "notes": "Interface reconstruite pour supprimer les scripts concurrents, restaurer une navigation fluide et fiabiliser la sélection vidéo. Tes données restent conservées.",
            "apkUrl": "https://raw.githubusercontent.com/Chasmet/ViralVoice/apk-builds/${APK_NAME}",
            "required": false
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-builds
          git rm -rf .
          git clean -fdx
          cp /tmp/viralvoice-apk/* .
          git add .
          git commit -m "Publish stable-signed ViralVoice ${VERSION_NAME} APK ${GITHUB_SHA}"
          git push --force origin HEAD:apk-builds

      - name: Create or update GitHub Release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${VERSION_NAME}"
          TITLE="ViralVoice v${VERSION_NAME} Stable"
          NOTES="ViralVoice ${VERSION_NAME} Stable : reconstruction de l'interface WebView avec une seule couche JavaScript/CSS, navigation libre, sélecteur vidéo fiable et récupération de résultat intégrée. APK signé avec la signature de mise à jour stable."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --latest
          else
            gh release create "$TAG" "$APK_NAME" \
              --target main \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest
          fi

      - name: Publish update manifest to main only after APK exists
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          cat > update.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "title": "ViralVoice ${VERSION_NAME} Stable est disponible",
            "notes": "Interface reconstruite pour supprimer les scripts concurrents, restaurer une navigation fluide et fiabiliser la sélection vidéo. Tes données restent conservées.",
            "apkUrl": "https://raw.githubusercontent.com/Chasmet/ViralVoice/apk-builds/${APK_NAME}",
            "required": false
          }
          EOF
          git add update.json
          if ! git diff --cached --quiet; then
            git commit -m "Publie le manifeste ViralVoice ${VERSION_NAME} après l'APK"
            git push origin main
          fi
