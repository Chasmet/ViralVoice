name: Build ViralVoice 4 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'backend/**'
      - 'lib/**'
      - 'scripts/**'
      - 'server-v3.js'
      - 'package.json'
      - 'script.js'
      - 'speaker-sync-v36.js'
      - 'pro-v36.js'
      - 'audio-presets.js'
      - 'runtime-v402.js'
      - 'index.html'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'backend/**'
      - 'lib/**'
      - 'scripts/**'
      - 'server-v3.js'
      - 'package.json'
      - 'script.js'
      - 'speaker-sync-v36.js'
      - 'pro-v36.js'
      - 'audio-presets.js'
      - 'runtime-v402.js'
      - 'index.html'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate ViralVoice backend and audio regression
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npm run check
          node --check runtime-v402.js
          cd backend
          npm install --no-audit --no-fund
          npm run check

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        shell: bash
        run: |
          gradle -p android wrapper --gradle-version 8.7
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare single APK
        shell: bash
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk ViralVoice-4.0.2.apk
          {
            echo "status=success"
            echo "version=4.0.2"
            echo "commit=${GITHUB_SHA}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > build-status.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViralVoice-4.0.2-APK
          path: ViralVoice-4.0.2.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p /tmp/viralvoice-apk
          cp ViralVoice-4.0.2.apk build-status.txt /tmp/viralvoice-apk/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-builds
          git rm -rf .
          git clean -fdx
          cp /tmp/viralvoice-apk/* .
          git add .
          git commit -m "Publish ViralVoice 4.0.2 APK ${GITHUB_SHA}"
          git push --force origin HEAD:apk-builds

      - name: Create or update GitHub Release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v4.0.2"
          TITLE="ViralVoice v4.0.2"
          NOTES="ViralVoice 4.0.2 : correctif du blocage sur Connexion/Réveil Render. Backend officiel forcé, timeout et trois tentatives réseau, suppression du contrôle de solde client redondant avant génération (le backend reste seul responsable du débit des minutes), correction des packs 5/30/60/180 minutes. Correctif audio 4.0.1 conservé."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ViralVoice-4.0.2.apk --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --latest
          else
            gh release create "$TAG" ViralVoice-4.0.2.apk \
              --target main \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest
          fi