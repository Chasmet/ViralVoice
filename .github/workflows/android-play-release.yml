name: Build Play Store AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Vérifier les secrets de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "PLAY_UPLOAD_KEYSTORE_BASE64 manquant" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "PLAY_STORE_PASSWORD manquant" && exit 1)
          test -n "$KEY_ALIAS" || (echo "PLAY_KEY_ALIAS manquant" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "PLAY_KEY_PASSWORD manquant" && exit 1)

      - name: Préparer la clé d'envoi
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/viralvoice-upload.jks"

      - name: Construire le bundle signé
        env:
          PLAY_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/viralvoice-upload.jks
          PLAY_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          gradle -p android wrapper --gradle-version 8.7
          cd android
          ./gradlew bundleRelease --stacktrace

      - name: Publier l'AAB
        uses: actions/upload-artifact@v4
        with:
          name: ViralVoice-Play-Store-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
