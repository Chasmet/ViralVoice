name: Publish ViralVoice UI 3.6

on:
  push:
    paths:
      - '.github/workflows/one-time-ui-v36.yml'

permissions:
  contents: write

jobs:
  publish-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update versioned frontend references
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/20260731v350/20260731v360/g' index.html
          sed -i 's/<span class="version-pill">3.5<\//<span class="version-pill">3.6<\//g' index.html
          sed -i 's/ViralVoice Pro 3.5/ViralVoice Pro 3.6/g' index.html
          sed -i 's/speaker-sync-v35.js/speaker-sync-v36.js/g' index.html
          sed -i 's/pro-v35.js/pro-v36.js/g' index.html
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          text = text.replace(
              'La traduction, les voix et le recalage temporel sont générés automatiquement.',
              'GPT adapte chaque réplique à sa durée, puis génère les voix premium.'
          )
          text = text.replace(
              'Traduction IA · Profils vocaux automatiques · Multi-voix',
              'GPT-5.6 · Voix premium · Synchronisation temporelle'
          )
          path.write_text(text)
          PY
          git rm .github/workflows/one-time-ui-v36.yml

      - name: Commit final UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat(ui): publier les références frontend ViralVoice 3.6'
          git push
