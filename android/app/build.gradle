plugins {
    id 'com.android.application'
}

def playKeystorePath = System.getenv('PLAY_UPLOAD_KEYSTORE_PATH')
def playStorePassword = System.getenv('PLAY_STORE_PASSWORD')
def playKeyAlias = System.getenv('PLAY_KEY_ALIAS')
def playKeyPassword = System.getenv('PLAY_KEY_PASSWORD')
def hasPlaySigning = playKeystorePath && playStorePassword && playKeyAlias && playKeyPassword

android {
    namespace 'com.chasmet.viralvoice'
    compileSdk 34

    defaultConfig {
        applicationId 'com.chasmet.viralvoice'
        minSdk 21
        targetSdk 34
        versionCode 17
        versionName '4.0.4'
    }

    signingConfigs {
        if (hasPlaySigning) {
            playRelease {
                storeFile file(playKeystorePath)
                storePassword playStorePassword
                keyAlias playKeyAlias
                keyPassword playKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasPlaySigning) {
                signingConfig signingConfigs.playRelease
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

// V4.0.4 : garde la WebView sur le runtime le plus récent sans effacer les
// données applicatives. Une mise à jour APK par-dessus l'installation conserve
// le localStorage, le compteur et les réglages de l'utilisateur.
tasks.configureEach { task ->
    if (task.name == 'preDebugBuild' || task.name == 'preReleaseBuild') {
        task.doFirst {
            def mainActivity = file('src/main/java/com/chasmet/viralvoice/MainActivity.java')
            if (!mainActivity.exists()) {
                throw new GradleException('MainActivity.java introuvable')
            }

            def source = mainActivity.getText('UTF-8')
            source = source
                    .replace('https://chasmet.github.io/ViralVoice/?app=365',
                            'https://chasmet.github.io/ViralVoice/?app=404')
                    .replace('ViralVoiceAndroid/3.6.5', 'ViralVoiceAndroid/4.0.4')
                    .replace('settings.setCacheMode(WebSettings.LOAD_DEFAULT);',
                            'settings.setCacheMode(WebSettings.LOAD_NO_CACHE);')

            mainActivity.write(source, 'UTF-8')
        }
    }
}
