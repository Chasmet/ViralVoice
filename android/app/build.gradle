plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chasmet.viralvoice'
    compileSdk 34

    defaultConfig {
        applicationId 'com.chasmet.viralvoice'
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName '3.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}
