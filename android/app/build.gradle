plugins {
    id 'com.android.application'
}

def playKeystorePath = System.getenv('PLAY_UPLOAD_KEYSTORE_PATH')
def playStorePassword = System.getenv('PLAY_STORE_PASSWORD')
def playKeyAlias = System.getenv('PLAY_KEY_ALIAS')
def playKeyPassword = System.getenv('PLAY_KEY_PASSWORD')
def hasPlaySigning = playKeystorePath && playStorePassword && playKeyAlias && playKeyPassword

android {
    namespace 'com.chasmet.viralvoice'
    compileSdk 34

    defaultConfig {
        applicationId 'com.chasmet.viralvoice'
        minSdk 21
        targetSdk 34
        versionCode 29
        versionName '4.1.0'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (hasPlaySigning) {
            playRelease {
                storeFile file(playKeystorePath)
                storePassword playStorePassword
                keyAlias playKeyAlias
                keyPassword playKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasPlaySigning) {
                signingConfig signingConfigs.playRelease
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}

// V4.1.0 Stable : une seule couche WebView (app-v410.js + stable-v410.css).
// La source historique de MainActivity reste compatible avec les anciens builds ;
// ces substitutions ne font que fixer l'URL et le User-Agent de l'APK produit.
tasks.configureEach { task ->
    if (task.name == 'preDebugBuild' || task.name == 'preReleaseBuild') {
        task.doFirst {
            def mainActivity = file('src/main/java/com/chasmet/viralvoice/MainActivity.java')
            if (!mainActivity.exists()) {
                throw new GradleException('MainActivity.java introuvable')
            }

            def source = mainActivity.getText('UTF-8')
            source = source
                    .replace('https://chasmet.github.io/ViralVoice/?app=365',
                            'https://chasmet.github.io/ViralVoice/?app=410')
                    .replace('ViralVoiceAndroid/3.6.5', 'ViralVoiceAndroid/4.1.0')
                    .replace('webView.clearCache(true);\n            webView.loadUrl(APP_URL + "&t=" + System.currentTimeMillis());',
                            'webView.loadUrl(APP_URL);')

            mainActivity.write(source, 'UTF-8')
        }
    }
}
